name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Install pnpm from package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Test the frontend update service
        run: python3 -m unittest discover -s deploy/ui-update -v

      - run: pnpm install --frozen-lockfile
      - name: Run tests with two Vitest workers
        run: pnpm test --maxWorkers=2
      - run: pnpm build

      - name: Check the deployment example
        run: |
          docker build -t sub2api-astryx:ci .
          docker run --rm -e SUB2API_UPSTREAM=127.0.0.1:18081 sub2api-astryx:ci nginx -t
          docker run -d --rm --name astryx-ci --network host -e SUB2API_UPSTREAM=127.0.0.1:18081 sub2api-astryx:ci
          trap 'docker stop astryx-ci >/dev/null' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:8080/index.html
          node deploy/smoke.mjs

      - name: Package CI-verified dist
        if: >-
          github.repository == 'feiwell/sub2api-astryx' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          github.event_name == 'pull_request')
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = pull_request ]; then
            CHANNEL=pr-merge
            ARTIFACT_NAME="astryx-pr-${PR_NUMBER}-${SOURCE_SHA}"
          else
            CHANNEL=main
            ARTIFACT_NAME="astryx-main-${SOURCE_SHA}"
          fi
          test -f dist/index.html
          export SOURCE_DATE_EPOCH=0
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -cf - -C dist . | gzip -n > dist.tar.gz
          sha256sum dist.tar.gz > dist.tar.gz.sha256
          CHANNEL="$CHANNEL" SOURCE_SHA="$SOURCE_SHA" node -e 'require("fs").writeFileSync("manifest.json", JSON.stringify({source_sha: process.env.SOURCE_SHA, channel: process.env.CHANNEL}, null, 2) + "\n")'
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Upload CI-verified package
        if: >-
          github.repository == 'feiwell/sub2api-astryx' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          github.event_name == 'pull_request')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.artifact_name }}
          path: |
            dist.tar.gz
            dist.tar.gz.sha256
            manifest.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
