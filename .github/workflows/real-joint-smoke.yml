name: Real joint backend/frontend smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# This workflow deliberately has no write, deployment, or production permissions.
permissions:
  contents: read
  actions: read

concurrency:
  group: real-joint-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Only a previously CI-verified main artifact is used; this is not a release.
  ASTRYX_SHA: 1725bfa20aa1ba6914f6bebf3c035105522d18ba
  SUB2API_TAG: v0.2.25
  SUB2API_ASSET: sub2api_0.2.25_linux_amd64.tar.gz

jobs:
  real-joint-smoke:
    name: real-joint-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sub2api_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: sub2api_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sub2api_ci -d sub2api_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Check out workflow and smoke test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install nginx with njs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nginx libnginx-mod-http-js gettext-base

      - name: Download and verify CI-tested Astryx dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frontend"
          mkdir -p "$work"
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$ASTRYX_SHA&per_page=100" \
            | jq -er --arg sha "$ASTRYX_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '[.workflow_runs[] | select(.head_sha == $sha and .head_repository.full_name == $repo and .event == "push" and .head_branch == "main" and .conclusion == "success")] | first.id // error("no successful main CI for fixed Astryx SHA")')"
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" \
            -n "astryx-main-$ASTRYX_SHA" -D "$work"
          jq -e --arg sha "$ASTRYX_SHA" \
            '.source_sha == $sha and .channel == "main"' "$work/manifest.json" >/dev/null
          (cd "$work" && sha256sum --check --strict dist.tar.gz.sha256)
          sudo mkdir -p /srv/astryx
          sudo tar -xzf "$work/dist.tar.gz" -C /srv/astryx
          test -f /srv/astryx/index.html

      - name: Download and verify official Sub2API release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/backend"
          mkdir -p "$work"
          release="$work/release.json"
          gh api "repos/Wei-Shaw/sub2api/releases/tags/$SUB2API_TAG" > "$release"
          jq -e --arg tag "$SUB2API_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false' "$release" >/dev/null
          url="$(jq -er --arg name "$SUB2API_ASSET" '.assets[] | select(.name == $name) | .browser_download_url' "$release")"
          digest="$(jq -er --arg name "$SUB2API_ASSET" '.assets[] | select(.name == $name) | .digest' "$release")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            -o "$work/$SUB2API_ASSET" "$url"
          printf '%s  %s\n' "${digest#sha256:}" "$work/$SUB2API_ASSET" | sha256sum --check --strict
          tar -xzf "$work/$SUB2API_ASSET" -C "$work"
          test -x "$work/sub2api"

      - name: Start isolated official backend
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/backend"
          mkdir -p "$RUNNER_TEMP/sub2api-data"
          env \
            AUTO_SETUP=true DATA_DIR="$RUNNER_TEMP/sub2api-data" \
            SERVER_HOST=127.0.0.1 SERVER_PORT=18081 SERVER_MODE=release \
            DATABASE_HOST=127.0.0.1 DATABASE_PORT=5432 DATABASE_USER=sub2api_ci \
            DATABASE_PASSWORD=ci-only-postgres-password DATABASE_DBNAME=sub2api_ci DATABASE_SSLMODE=disable \
            REDIS_HOST=127.0.0.1 REDIS_PORT=6379 REDIS_DB=0 REDIS_PASSWORD= \
            ADMIN_EMAIL=ci-smoke-admin@invalid.example ADMIN_PASSWORD=ci-only-admin-password \
            JWT_SECRET=ci-only-jwt-secret-0123456789-abcdef-0123456789 \
            TOTP_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            RUN_MODE=standard MCP_PUBLIC_URL= UPDATE_GITHUB_TOKEN= \
            LOG_OUTPUT_TO_FILE=false LOG_OUTPUT_TO_STDOUT=true \
            "$work/sub2api" > "$RUNNER_TEMP/sub2api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sub2api.pid"
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18081/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Official Sub2API did not become healthy in the isolated smoke environment.' >&2
          if test -s "$RUNNER_TEMP/sub2api.log"; then
            python3 -c 'import re,sys; text=open(sys.argv[1], encoding="utf-8", errors="replace").read(); text=re.sub(r"(?i)(password|secret|token|key)([=: ]+)[^\\s,}]+", r"\\1\\2[REDACTED]", text); print(text[-12000:])' "$RUNNER_TEMP/sub2api.log"
          fi
          exit 1

      - name: Configure nginx dist-to-backend proxy
        run: |
          set -euo pipefail
          sudo cp deploy/nonce.js /etc/nginx/nonce.js
          SUB2API_UPSTREAM=127.0.0.1:18081 SUB2API_PUBLIC_SCHEME=http \
            envsubst '${SUB2API_UPSTREAM} ${SUB2API_PUBLIC_SCHEME}' < deploy/site.conf.template \
            | sudo tee /tmp/astryx-site.conf >/dev/null
          sudo cp deploy/nginx.conf /tmp/astryx-nginx.conf
          sudo nginx -c /tmp/astryx-nginx.conf -t
          sudo nginx -c /tmp/astryx-nginx.conf
          curl --fail --silent --show-error --retry 15 --retry-delay 1 \
            http://127.0.0.1:8080/index.html >/dev/null

      - name: Run real frontend/backend compatibility smoke
        env:
          SMOKE_URL: http://127.0.0.1:8080
          BACKEND_URL: http://127.0.0.1:18081
        run: node deploy/real-joint-smoke.mjs

      - name: Stop isolated backend and nginx
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/sub2api.pid"; then
            kill "$(cat "$RUNNER_TEMP/sub2api.pid")" 2>/dev/null || true
          fi
          sudo nginx -c /tmp/astryx-nginx.conf -s quit 2>/dev/null || true
