<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
  <title id="title">请求去向</title>
  <desc id="desc">浏览器请求经 Vite 或 Nginx 分流。/dashboard 交给 React 页面，/api/v1/settings/public 转到 Sub2API 后端 API，/v1/responses 转到同一后端的网关。</desc>
  <rect width="720" height="1000" rx="28" fill="#F3F0E8"/>
  <g id="header">
    <g transform="translate(56 40) scale(0.6875)" fill="none" stroke="#F7F4EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect width="64" height="64" rx="13" fill="#273443" stroke="none"/>
      <path d="M13 24h13l11 16h14"/>
      <path d="M13 40h13l11-16h14"/>
    </g>
    <text x="116" y="74" fill="#273443" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="42" font-weight="700">请求去向</text>
    <text x="116" y="129" fill="#243240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32">同一入口，按路径分流</text>
  </g>
  <g id="browser">
    <rect x="48" y="156" width="624" height="132" rx="16" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
    <text x="72" y="210" fill="#273443" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="36" font-weight="700">浏览器</text>
    <text x="72" y="254" fill="#243240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32">页面、API 与网关在同一来源</text>
  </g>
  <g id="arrow" fill="#273443" stroke="#273443">
    <line x1="360" y1="288" x2="360" y2="318" stroke-width="2"/>
    <path d="M351 318h18l-9 12z"/>
  </g>
  <g id="ingress">
    <rect x="48" y="336" width="624" height="132" rx="16" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
    <text x="72" y="390" fill="#273443" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="36" font-weight="700">入口</text>
    <text x="72" y="434" fill="#243240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32">Vite 开发代理或容器 Nginx</text>
  </g>
  <text x="48" y="512" fill="#273443" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="700">三条去向</text>
  <g id="spa">
    <rect x="48" y="532" width="624" height="136" rx="16" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
    <rect x="64" y="556" width="8" height="88" rx="4" fill="#273443"/>
    <text x="88" y="586" fill="#273443" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="700">页面</text>
    <text x="88" y="632" fill="#273443" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32">/dashboard</text>
  </g>
  <g id="api">
    <rect x="48" y="684" width="624" height="136" rx="16" fill="#E6EDF2" stroke="#C5D2DB" stroke-width="1.5"/>
    <rect x="64" y="708" width="8" height="88" rx="4" fill="#273443"/>
    <text x="88" y="738" fill="#273443" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="700">控制台 API</text>
    <text x="88" y="784" fill="#273443" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32">/api/v1/settings/public</text>
  </g>
  <g id="gateway">
    <rect x="48" y="836" width="624" height="136" rx="16" fill="#273443"/>
    <text x="72" y="890" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="700">网关</text>
    <text x="72" y="936" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32">/v1/responses</text>
    <g transform="translate(588 860) scale(0.75)" fill="none" stroke="#F7F4EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="60" height="60" rx="13"/>
      <path d="M13 24h13l11 16h14"/>
      <path d="M13 40h13l11-16h14"/>
    </g>
  </g>
</svg>
