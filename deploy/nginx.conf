load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Omit query strings, cookies and request headers from access logs.
    log_format route '$request_method $uri $status';
    access_log /dev/stdout route;

    # Writable paths for the unprivileged worker.
    client_body_temp_path /tmp/astryx-client;
    proxy_temp_path /tmp/astryx-proxy;
    fastcgi_temp_path /tmp/astryx-fastcgi;
    uwsgi_temp_path /tmp/astryx-uwsgi;
    scgi_temp_path /tmp/astryx-scgi;

    include /tmp/astryx-site.conf;
}
